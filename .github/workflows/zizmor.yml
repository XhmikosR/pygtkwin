name: zizmor

on:
  push:
    branches:
      - '**'
      - '!dependabot/**' # avoid duplicate runs; the pull_request event handles dependabot PRs
    paths:
      - '.github/**'
      - 'actions/**'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/**'
      - 'actions/**'
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Run zizmor
    # The zizmor action needs a working Docker daemon, which ubuntu-slim lacks.
    runs-on: ubuntu-latest
    # Normal runtime is under 30 seconds.
    timeout-minutes: 5

    permissions:
      security-events: write # upload SARIF to code scanning
      contents: read # clone the repository
      actions: read # upload-sarif reads the run in private repositories

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
