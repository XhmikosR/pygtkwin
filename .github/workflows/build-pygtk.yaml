name: Build and Package PyGTK

on:
  push:
    branches:
      - 'main'
      - 'dev*'
      - '!dependabot/**' # avoid duplicate runs; the pull_request event handles dependabot PRs
    tags:
      - 'v*'
    paths-ignore: &paths-ignore
      - '.github/dependabot.yml'
      - '.github/workflows/build-gtk-themes.yaml'
      - '.github/workflows/zizmor.yml'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
      - 'make_gtk_theme.sh'
      - 'package-lock.json'
      - 'package.json'
      - 'README.md'
  pull_request:
    paths-ignore: *paths-ignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
  GTK_VERSION: 3.24

jobs:
  vcpkg-build:
    name: Build python and PyGTK (${{ matrix.triplet }})
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      # A cancelled matrix job would not save its vcpkg cache
      fail-fast: false
      matrix:
        include:
          - triplet: x86-windows
            arch: x86
          - triplet: x64-windows
            arch: x64

    env:
      VCPKG_COMMIT: '7ece2c79b95131924820fb67c977abb3c4602724'
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      # gobject-introspection runs the built binaries, so host = target
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python requirements
        shell: bash
        run: |
          python -m pip install --no-deps -r requirements-vcpkg.txt
          python -m pip check

      - name: Set up pygtkwin environment
        uses: $/actions/pygtkwin-env
        with:
          arch: ${{ matrix.arch }}

      - name: Cache vcpkg binary cache
        # Skipped for tags: vcpkg trusts archives by their names, so a poisoned
        # cache could reach a release.
        if: github.ref_type != 'tag'
        # zizmor: ignore[cache-poisoning] releases build with a cold cache, see above
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/vcpkg/archives
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('patches/0002-vcpkg-glib-unc.patch', 'patches/librsvg-pixbufloader-svg.patch', 'patches/gdk-pixbuf-png-only.patch', format('triplets/{0}.cmake', matrix.triplet)) }}
          # The last one matches caches saved before the matrix. Archives are
          # named by ABI hash, so another triplet's archives are just unused.
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-
            ${{ runner.os }}-vcpkg-${{ env.VCPKG_COMMIT }}-

      - name: vcpkg build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd ./vcpkg
          git apply --ignore-whitespace --whitespace=nowarn "$env:GITHUB_WORKSPACE/patches/0002-vcpkg-glib-unc.patch"
          if ($LASTEXITCODE -ne 0) { throw "git apply 0002-vcpkg-glib-unc.patch failed" }
          git apply --ignore-whitespace --whitespace=nowarn "$env:GITHUB_WORKSPACE/patches/gdk-pixbuf-png-only.patch"
          if ($LASTEXITCODE -ne 0) { throw "git apply gdk-pixbuf-png-only.patch failed" }
          Copy-Item "$env:GITHUB_WORKSPACE/patches/librsvg-pixbufloader-svg.patch" ./ports/librsvg/add-pixbufloader-svg.patch
          (Get-Content ./ports/librsvg/portfile.cmake) -replace 'meson-pkgconfig-and-def-file\.patch', "meson-pkgconfig-and-def-file.patch`n        add-pixbufloader-svg.patch" | Set-Content ./ports/librsvg/portfile.cmake
          ./bootstrap-vcpkg.bat
          ./vcpkg format-manifest ports/gdk-pixbuf/vcpkg.json
          if ($LASTEXITCODE -ne 0) { throw "vcpkg format-manifest gdk-pixbuf failed" }
          git add ports/gdk-pixbuf
          ./vcpkg x-add-version gdk-pixbuf
          if ($LASTEXITCODE -ne 0) { throw "vcpkg x-add-version gdk-pixbuf failed" }
          $cacheDir = Join-Path $env:LOCALAPPDATA 'vcpkg\archives'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          $binarySource = "clear;files,$cacheDir,readwrite"
          ./vcpkg install python3 fontconfig[tools] gobject-introspection harfbuzz[introspection] pango[introspection] gdk-pixbuf[introspection] atk[introspection] libcroco librsvg gtk3[introspection] --triplet $env:VCPKG_TRIPLET --binarysource=$binarySource
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Generate platform-specific typelibs
        shell: bash
        run: |
          ./generate-platform-typelibs.sh "vcpkg/installed/$VCPKG_TRIPLET"

      - name: Validate build
        shell: bash
        run: |
          ./validate-build.sh "vcpkg/installed/$VCPKG_TRIPLET"

      - name: Prepare for packing
        shell: bash
        run: |
          cp -a vcpkg/installed vcpkg_installed
          echo "Size before cleanup: $(du -sh vcpkg_installed)"
          rm -rf "vcpkg_installed/$VCPKG_TRIPLET/debug" "vcpkg_installed/$VCPKG_TRIPLET"/bin/*.pdb
          # Keep only the target triplet, not vcpkg's metadata or another tree
          find vcpkg_installed -mindepth 1 -maxdepth 1 ! -name "$VCPKG_TRIPLET" -exec rm -rf {} +
          echo "Size after cleanup: $(du -sh vcpkg_installed)"

      - name: Package the build
        shell: bash
        env:
          # 5 is 7z's default; releases get the smallest archive
          COMPRESSION_LEVEL: ${{ github.ref_type == 'tag' && '9' || '5' }}
        run: |
          7z a -bso0 -bsp0 -t7z "-mx=$COMPRESSION_LEVEL" -mmt=on "$GTK_BUILD_NAME.7z" vcpkg_installed
          sha256sum "$GTK_BUILD_NAME.7z"

      - name: Test the build
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        run: |
          "%PYTHON%" -V
          "%PYTHON%" show_versions.py
          :: pip is not installed

      - name: Smoke test HTTPS (TLS 1.2/1.3)
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_DIR\bin;$env:PATH"
          & $env:PYTHON test_https.py --dll-directory "$env:VCPKG_DIR\bin"
          if ($LASTEXITCODE -ne 0) { throw "HTTPS smoke test failed" }

      - name: Upload the build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.GTK_BUILD_NAME }}.7z
          # Already compressed; the artifact is named after the file
          archive: false
          if-no-files-found: error

  pygobject-build:
    name: Build pygobject (${{ matrix.triplet }})
    runs-on: windows-latest
    timeout-minutes: 30
    needs: vcpkg-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: x86-windows
            arch: x86
            wheel: win32
          - triplet: x64-windows
            arch: x64
            wheel: win_amd64

    env:
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      PYGOBJECT_VERSION: 3.58.0
      PYGOBJECT_SHA256: 45068697de3ffe46840ca369705f23118b34db4f7deb63f6eff079a6734ddcca

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pygtkwin environment
        uses: $/actions/pygtkwin-env
        with:
          arch: ${{ matrix.arch }}

      - name: Download PyGTK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.GTK_BUILD_NAME }}.7z

      - name: Extract PyGTK files
        shell: bash
        run: |
          sha256sum "$GTK_BUILD_NAME.7z"
          7z x -bso0 -bsp0 "$GTK_BUILD_NAME.7z"
          if [ ! -f "$(cygpath -u "$PYTHON")" ]; then
            echo "Error: Python executable not found at $PYTHON"
            exit 1
          fi

      - name: Download and extract PyGObject source
        shell: bash
        run: |
          curl -fL "https://download.gnome.org/sources/pygobject/3.58/pygobject-$PYGOBJECT_VERSION.tar.gz" -o pygobject.tar.gz
          certutil -hashfile pygobject.tar.gz SHA256
          echo "$PYGOBJECT_SHA256 pygobject.tar.gz" | sha256sum -c || exit 1
          tar xf pygobject.tar.gz

      - name: Install build dependencies
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        run: |
          "%PYTHON%" -m ensurepip --upgrade
          "%PYTHON%" -m pip install --upgrade pip
          "%PYTHON%" -m pip install --no-deps -r requirements.txt
          :: No pip check: the pkgconf Windows wheel's metadata claims linux_x86_64

      - name: Copy python312.lib to python libs directory
        shell: pwsh
        run: |
          echo Searching for required files
          Get-ChildItem -Path "$env:VCPKG_DIR" -Include python312.lib -Recurse
          Get-ChildItem -Path "$env:VCPKG_DIR" -Include Gtk-3.0.typelib -Recurse
          echo Creating python libs directory
          New-Item -Path "$env:PYTHON_DIR\libs" -ItemType Directory
          echo Copying python312.lib to libs directory
          Copy-Item -Path "$env:VCPKG_DIR\lib\python312.lib" -Destination "$env:PYTHON_DIR\libs\"

      - name: Build wheel
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        env:
          PKG_CONFIG: ${{ env.VCPKG_DIR }}\tools\python3\Lib\site-packages\pkgconf\.bin\pkgconf.exe
          PKG_CONFIG_PATH: ${{ env.VCPKG_DIR }}\lib\pkgconfig
          CC: cl
          CXX: cl
          WHEEL_TAG: ${{ matrix.wheel }}
        run: |
          for /F "usebackq" %%i in (`%PKG_CONFIG% --cflags python-3.12`) do set CL=%%i
          cd pygobject-%PYGOBJECT_VERSION%
          "%PYTHON%" -m build --wheel --no-isolation
          dir /b /s *.whl

          echo PYGOBJECT_WHL=%GITHUB_WORKSPACE%\pygobject-%PYGOBJECT_VERSION%\dist\pygobject-%PYGOBJECT_VERSION%-cp312-cp312-%WHEEL_TAG%.whl>>%GITHUB_ENV%

      - name: Test wheel
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        run: |
          if not exist "%PYGOBJECT_WHL%" (
            echo Error: %PYGOBJECT_WHL% does not exist.
            exit /b 1
          )
          "%PYTHON%" -m pip install --no-deps "%PYGOBJECT_WHL%"

          robocopy /MIR /COPYALL %VCPKG_DIR%\lib\girepository-1.0 %PYTHON_DIR%\lib\girepository-1.0
          set PATH=%PATH%;%VCPKG_DIR%\bin;%VCPKG_DIR%\lib
          set GI_TYPELIB_PATH=%VCPKG_DIR%\lib\girepository-1.0
          "%PYTHON%" show_versions.py --dll-directory=%VCPKG_DIR%\bin

          set GI_WARNING_LOG=%TEMP%\pygobject-platform-gir-stderr.txt
          "%PYTHON%" -c "import os; os.add_dll_directory(r'%VCPKG_DIR%\bin'); import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gio, GioWin32, GLibWin32, Gtk; assert hasattr(GLibWin32, 'get_command_line'); assert hasattr(GioWin32.InputStream, 'get_handle'); assert hasattr(GioWin32.OutputStream, 'get_handle')" 2>"%GI_WARNING_LOG%"
          if errorlevel 1 (
            type "%GI_WARNING_LOG%"
            exit /b 1
          )
          type "%GI_WARNING_LOG%"
          findstr /C:"Unable to load platform-specific GIO introspection data" /C:"Name conflict for platform-specific symbol" "%GI_WARNING_LOG%" >nul && (
            echo Platform-specific typelib regression detected.
            exit /b 1
          )
          exit /b 0

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pygobject-wheel-${{ matrix.triplet }}
          path: ${{ env.PYGOBJECT_WHL}}
          if-no-files-found: error

  # One job creates the release, so parallel jobs don't race to create it
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [vcpkg-build, pygobject-build]
    permissions:
      contents: write # create the release and upload its files

    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # The themes workflow may have created the release already
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber gtk*.7z pygobject-*.whl
          else
            gh release create "$TAG" --verify-tag --generate-notes gtk*.7z pygobject-*.whl
          fi
