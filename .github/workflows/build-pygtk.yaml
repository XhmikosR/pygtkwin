name: Build and Package PyGTK

on:
  push:
    branches:
      - '**'
      - '!dependabot/**' # avoid duplicate runs; the pull_request event handles dependabot PRs
    tags:
      - 'v*'
    paths-ignore: &paths-ignore
      - '.github/dependabot.yml'
      - '.github/workflows/build-gtk-themes.yaml'
      - '.github/workflows/zizmor.yml'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
      - 'make_gtk_theme.sh'
      - 'README.md'
  pull_request:
    paths-ignore: *paths-ignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
  GTK_VERSION: 3.24

jobs:
  vcpkg-build:
    name: Build python and PyGTK (${{ matrix.triplet }})
    runs-on: windows-latest
    strategy:
      # A cancelled matrix job would not save its vcpkg cache
      fail-fast: false
      matrix:
        include:
          - triplet: x86-windows
            arch: x86
          - triplet: x64-windows
            arch: x64

    env:
      VCPKG_COMMIT: '7ece2c79b95131924820fb67c977abb3c4602724'
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      # gobject-introspection runs the built binaries, so host = target
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pygtkwin environment
        uses: ./actions/pygtkwin-env
        with:
          arch: ${{ matrix.arch }}

      - name: Cache vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('0002-vcpkg-glib-unc.patch', 'librsvg-pixbufloader-svg.patch', 'gdk-pixbuf-png-only.patch', format('triplets/{0}.cmake', matrix.triplet)) }}
          # The last one matches caches saved before the matrix. Archives are
          # named by ABI hash, so another triplet's archives are just unused.
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-
            ${{ runner.os }}-vcpkg-${{ env.VCPKG_COMMIT }}-

      - name: vcpkg build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/microsoft/vcpkg.git ./vcpkg
          cd ./vcpkg
          git checkout ${{ env.VCPKG_COMMIT }}
          git apply --ignore-whitespace --whitespace=nowarn ${{ github.workspace }}/0002-vcpkg-glib-unc.patch
          if ($LASTEXITCODE -ne 0) { throw "git apply 0002-vcpkg-glib-unc.patch failed" }
          git apply --ignore-whitespace --whitespace=nowarn ${{ github.workspace }}/gdk-pixbuf-png-only.patch
          if ($LASTEXITCODE -ne 0) { throw "git apply gdk-pixbuf-png-only.patch failed" }
          Copy-Item ${{ github.workspace }}/librsvg-pixbufloader-svg.patch ./ports/librsvg/add-pixbufloader-svg.patch
          (Get-Content ./ports/librsvg/portfile.cmake) -replace 'meson-pkgconfig-and-def-file\.patch', "meson-pkgconfig-and-def-file.patch`n        add-pixbufloader-svg.patch" | Set-Content ./ports/librsvg/portfile.cmake
          ./bootstrap-vcpkg.bat
          ./vcpkg format-manifest ports/gdk-pixbuf/vcpkg.json
          if ($LASTEXITCODE -ne 0) { throw "vcpkg format-manifest gdk-pixbuf failed" }
          git add ports/gdk-pixbuf
          ./vcpkg x-add-version gdk-pixbuf
          if ($LASTEXITCODE -ne 0) { throw "vcpkg x-add-version gdk-pixbuf failed" }
          $cacheDir = Join-Path $env:LOCALAPPDATA 'vcpkg\archives'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          $binarySource = "clear;files,$cacheDir,readwrite"
          python -m ensurepip --upgrade
          python -m pip install virtualenv
          ./vcpkg install python3 fontconfig[tools] gobject-introspection harfbuzz[introspection] pango[introspection] gdk-pixbuf[introspection] atk[introspection] libcroco librsvg gtk3[introspection] --triplet $env:VCPKG_TRIPLET --binarysource=$binarySource
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Generate platform-specific typelibs
        shell: bash
        run: |
          ./generate-platform-typelibs.sh vcpkg/installed/${{ env.VCPKG_TRIPLET }}

      - name: Validate build
        shell: bash
        run: |
          ./validate-build.sh vcpkg/installed/${{ env.VCPKG_TRIPLET }}

      - name: Prepare for packing
        shell: bash
        run: |
          cp -a vcpkg/installed vcpkg_installed
          echo "Size before cleanup: $(du -sh vcpkg_installed)"
          rm -rf vcpkg_installed/${{ env.VCPKG_TRIPLET }}/debug vcpkg_installed/${{ env.VCPKG_TRIPLET }}/bin/*.pdb
          # Keep only the target triplet, not vcpkg's metadata or another tree
          find vcpkg_installed -mindepth 1 -maxdepth 1 ! -name '${{ env.VCPKG_TRIPLET }}' -exec rm -rf {} +
          echo "Size after cleanup: $(du -sh vcpkg_installed)"

      - name: Package the build
        shell: cmd
        run: |
          7z a -tzip -mx=9 ${{ env.GTK_BUILD_NAME }}.zip vcpkg_installed
          certutil -hashfile ${{ env.GTK_BUILD_NAME }}.zip SHA256

      - name: Test the build
        shell: cmd
        run: |
          ${{ env.PYTHON }} -V
          ${{ env.PYTHON }} show_versions.py
          :: pip is not installed

      - name: Smoke test HTTPS (TLS 1.2/1.3)
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_DIR\bin;$env:PATH"
          & $env:PYTHON test_https.py --dll-directory "$env:VCPKG_DIR\bin"
          if ($LASTEXITCODE -ne 0) { throw "HTTPS smoke test failed" }

      - name: Upload the build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.GTK_BUILD_NAME }}
          path: ${{ env.GTK_BUILD_NAME }}.zip
          if-no-files-found: error

  pygobject-build:
    name: Build pygobject (${{ matrix.triplet }})
    runs-on: windows-latest
    needs: vcpkg-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: x86-windows
            arch: x86
            wheel: win32
          - triplet: x64-windows
            arch: x64
            wheel: win_amd64

    env:
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      PYGOBJECT_VERSION: 3.58.0
      PYGOBJECT_SHA256: 45068697de3ffe46840ca369705f23118b34db4f7deb63f6eff079a6734ddcca

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pygtkwin environment
        uses: ./actions/pygtkwin-env
        with:
          arch: ${{ matrix.arch }}

      - name: Download PyGTK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.GTK_BUILD_NAME }}

      - name: Extract PyGTK files
        shell: cmd
        run: |
          certutil -hashfile ${{ env.GTK_BUILD_NAME }}.zip SHA256
          7z x ${{ env.GTK_BUILD_NAME }}.zip
          if not exist "${{ env.PYTHON }}" (
            echo Error: Python executable not found at ${{ env.PYTHON }}
            exit /b 1
          )

      - name: Download and extract PyGObject source
        shell: bash
        run: |
          curl -fL https://download.gnome.org/sources/pygobject/3.58/pygobject-${{ env.PYGOBJECT_VERSION }}.tar.gz -o pygobject.tar.gz
          certutil -hashfile pygobject.tar.gz SHA256
          echo "${{ env.PYGOBJECT_SHA256 }} pygobject.tar.gz" | sha256sum -c || exit 1
          tar xf pygobject.tar.gz

      - name: Install build dependencies
        shell: cmd
        run: |
          ${{ env.PYTHON }} -m ensurepip --upgrade
          ${{ env.PYTHON }} -m pip install --upgrade pip
          ${{ env.PYTHON }} -m pip install -r requirements.txt

      - name: Copy python312.lib to python libs directory
        shell: pwsh
        run: |
          echo Searching for required files
          Get-ChildItem -Path "${{ env.VCPKG_DIR }}" -Include python312.lib -Recurse
          Get-ChildItem -Path "${{ env.VCPKG_DIR }}" -Include Gtk-3.0.typelib -Recurse
          echo Creating python libs directory
          New-Item -Path "${{ env.PYTHON_DIR }}\libs" -ItemType Directory
          echo Copying python312.lib to libs directory
          Copy-Item -Path "${{ env.VCPKG_DIR }}\lib\python312.lib" -Destination "${{ env.PYTHON_DIR }}\libs\"

      - name: Build wheel
        shell: cmd
        env:
          PKG_CONFIG: ${{ env.VCPKG_DIR }}\tools\python3\Lib\site-packages\pkgconf\.bin\pkgconf.exe
          PKG_CONFIG_PATH: ${{ env.VCPKG_DIR }}\lib\pkgconfig
          CC: cl
          CXX: cl
        run: |
          for /F "usebackq" %%i in (`${{ env.PKG_CONFIG }} --cflags python-3.12`) do set CL=%%i
          cd pygobject-${{ env.PYGOBJECT_VERSION }}
          ${{ env.PYTHON }} -m build --wheel
          dir /b /s *.whl

          echo PYGOBJECT_WHL=${{ github.workspace }}\pygobject-${{ env.PYGOBJECT_VERSION }}\dist\pygobject-${{ env.PYGOBJECT_VERSION }}-cp312-cp312-${{ matrix.wheel }}.whl>>%GITHUB_ENV%

      - name: Test wheel
        shell: cmd
        run: |
          if not exist "${{ env.PYGOBJECT_WHL }}" (
            echo Error: ${{ env.PYGOBJECT_WHL }} does not exist.
            exit /b 1
          )
          ${{ env.PYTHON }} -m pip install "${{ env.PYGOBJECT_WHL }}"

          robocopy /MIR /COPYALL ${{ env.VCPKG_DIR }}\lib\girepository-1.0 ${{ env.PYTHON_DIR }}\lib\girepository-1.0
          set PATH=%PATH%;${{ env.VCPKG_DIR }}\bin;${{ env.VCPKG_DIR }}\lib
          set GI_TYPELIB_PATH=${{ env.VCPKG_DIR }}\lib\girepository-1.0
          ${{ env.PYTHON }} show_versions.py --dll-directory=${{ env.VCPKG_DIR }}\bin

          set GI_WARNING_LOG=%TEMP%\pygobject-platform-gir-stderr.txt
          ${{ env.PYTHON }} -c "import os; os.add_dll_directory(r'${{ env.VCPKG_DIR }}\bin'); import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gio, GioWin32, GLibWin32, Gtk; assert hasattr(GLibWin32, 'get_command_line'); assert hasattr(GioWin32.InputStream, 'get_handle'); assert hasattr(GioWin32.OutputStream, 'get_handle')" 2>"%GI_WARNING_LOG%"
          if errorlevel 1 (
            type "%GI_WARNING_LOG%"
            exit /b 1
          )
          type "%GI_WARNING_LOG%"
          findstr /C:"Unable to load platform-specific GIO introspection data" /C:"Name conflict for platform-specific symbol" "%GI_WARNING_LOG%" >nul && (
            echo Platform-specific typelib regression detected.
            exit /b 1
          )
          exit /b 0

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pygobject-wheel-${{ matrix.triplet }}
          path: ${{ env.PYGOBJECT_WHL}}
          if-no-files-found: error

  # One job creates the release, so parallel jobs don't race to create it
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [vcpkg-build, pygobject-build]
    permissions:
      contents: write # create the release and upload its files

    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            gtk*.zip
            pygobject-*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
