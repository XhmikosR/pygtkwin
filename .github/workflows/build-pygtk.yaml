name: Build and Package PyGTK

on:
  push:
    branches:
      - 'main'
      - 'dev*'
      - '!dependabot/**' # avoid duplicate runs; the pull_request event handles dependabot PRs
    tags:
      - 'v*'
    paths-ignore: &paths-ignore
      - '.github/dependabot.yml'
      - '.github/workflows/build-gtk-themes.yaml'
      - '.github/workflows/zizmor.yml'
      - '.gitattributes'
      - '.gitignore'
      - 'install-theme-tools.sh'
      - 'LICENSE'
      - 'make_gtk_theme.sh'
      - 'package-lock.json'
      - 'package.json'
      - 'README.md'
  pull_request:
    paths-ignore: *paths-ignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
  GTK_VERSION: 3.24

jobs:
  vcpkg-build:
    name: Build python and PyGTK (${{ matrix.triplet }})
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      # A cancelled matrix job would not save its vcpkg cache
      fail-fast: false
      matrix:
        include:
          - triplet: x86-windows
            arch: x86
          - triplet: x64-windows
            arch: x64

    env:
      VCPKG_COMMIT: '7ece2c79b95131924820fb67c977abb3c4602724'
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      # gobject-introspection runs the built binaries, so host = target
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python requirements
        shell: bash
        run: |
          python -m pip install --no-deps -r requirements-vcpkg.txt
          python -m pip check

      - name: Set up pygtkwin environment
        uses: $/actions/pygtkwin-env
        with:
          arch: ${{ matrix.arch }}

      - name: Cache vcpkg binary cache
        # Skipped for tags: vcpkg trusts archives by their names, so a poisoned
        # cache could reach a release.
        if: github.ref_type != 'tag'
        # zizmor: ignore[cache-poisoning] releases build with a cold cache, see above
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/vcpkg/archives
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('build-vcpkg.ps1', 'patches/0002-vcpkg-glib-unc.patch', 'patches/librsvg-pixbufloader-svg.patch', 'patches/gdk-pixbuf-png-only.patch', format('triplets/{0}.cmake', matrix.triplet)) }}
          # The last one matches caches saved before the matrix. Archives are
          # named by ABI hash, so another triplet's archives are just unused.
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-
            ${{ runner.os }}-vcpkg-${{ env.VCPKG_COMMIT }}-

      - name: vcpkg build
        shell: pwsh
        run: ./build-vcpkg.ps1 -Triplet $env:VCPKG_TRIPLET

      - name: Generate platform-specific typelibs
        shell: bash
        run: |
          ./generate-platform-typelibs.sh "vcpkg/installed/$VCPKG_TRIPLET"

      - name: Validate build
        shell: bash
        run: |
          ./validate-build.sh "vcpkg/installed/$VCPKG_TRIPLET"

      - name: Package the build
        shell: pwsh
        env:
          # 5 is 7z's default; releases get the smallest archive
          COMPRESSION_LEVEL: ${{ github.ref_type == 'tag' && '9' || '5' }}
        run: ./package-build.ps1 -Triplet $env:VCPKG_TRIPLET -Archive "$env:GTK_BUILD_NAME.7z" -Level $env:COMPRESSION_LEVEL

      - name: Test the build
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        run: |
          "%PYTHON%" -V
          "%PYTHON%" show_versions.py
          :: pip is not installed

      - name: Smoke test HTTPS (TLS 1.2/1.3)
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_DIR\bin;$env:PATH"
          & $env:PYTHON test_https.py --dll-directory "$env:VCPKG_DIR\bin"
          if ($LASTEXITCODE -ne 0) { throw "HTTPS smoke test failed" }

      - name: Upload the build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.GTK_BUILD_NAME }}.7z
          # Already compressed; the artifact is named after the file
          archive: false
          if-no-files-found: error

  pygobject-build:
    name: Build pygobject (${{ matrix.triplet }})
    runs-on: windows-latest
    timeout-minutes: 30
    needs: vcpkg-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: x86-windows
            arch: x86
            wheel: win32
          - triplet: x64-windows
            arch: x64
            wheel: win_amd64

    env:
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      PYGOBJECT_VERSION: 3.58.0
      PYGOBJECT_SHA256: 45068697de3ffe46840ca369705f23118b34db4f7deb63f6eff079a6734ddcca

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pygtkwin environment
        uses: $/actions/pygtkwin-env
        with:
          arch: ${{ matrix.arch }}

      - name: Download PyGTK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.GTK_BUILD_NAME }}.7z

      - name: Extract PyGTK files
        shell: bash
        run: |
          sha256sum "$GTK_BUILD_NAME.7z"
          7z x -bso0 -bsp0 "$GTK_BUILD_NAME.7z"

      - name: Build wheel
        shell: pwsh
        env:
          WHEEL_TAG: ${{ matrix.wheel }}
        run: ./build-pygobject.ps1 -WheelTag $env:WHEEL_TAG

      - name: Test wheel
        shell: pwsh
        run: ./test-pygobject.ps1 -Wheel $env:PYGOBJECT_WHL

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.PYGOBJECT_WHL }}
          # A wheel is already a zip; the artifact is named after the file
          archive: false
          if-no-files-found: error

  # One job creates the release, so parallel jobs don't race to create it
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [vcpkg-build, pygobject-build]
    permissions:
      contents: write # create the release and upload its files

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: ./create-release.sh "$TAG" gtk*.7z pygobject-*.whl
