name: Build GTK themes

on:
  push:
    branches:
      - '**'
      - '!dependabot/**' # avoid duplicate runs; the pull_request event handles dependabot PRs
    tags:
      - 'v*'
    paths: &paths
      - '.github/workflows/build-gtk-themes.yaml'
      - 'make_gtk_theme.sh'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build themes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # No npm cache in a workflow that publishes releases
          package-manager-cache: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sassc p7zip-full

      - name: Install oxipng
        run: |
          OXIPNG_VER=10.2.1
          OXIPNG_SHA256=46e3c4beb9aae57290ad809dd3374b07153579d3322a3778c53900633618b7c6
          curl -fsSL "https://github.com/oxipng/oxipng/releases/download/v${OXIPNG_VER}/oxipng-${OXIPNG_VER}-x86_64-unknown-linux-gnu.tar.gz" -o oxipng.tar.gz
          echo "${OXIPNG_SHA256}  oxipng.tar.gz" | sha256sum -c -
          tar -xzf oxipng.tar.gz
          sudo install -m 0755 "oxipng-${OXIPNG_VER}-x86_64-unknown-linux-gnu/oxipng" /usr/local/bin/oxipng
          oxipng --version

      - name: Install svgo
        # Ignore scripts to avoid potential security issues.
        run: npm ci --ignore-scripts

      - name: Build GTK themes
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bash make_gtk_theme.sh

      - name: Upload themes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gtk-themes
          path: gtk-themes.7z
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write # create the release and upload its files

    steps:
      - name: Download themes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gtk-themes

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # The PyGTK workflow may have created the release already
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber gtk-themes.7z
          else
            gh release create "$TAG" --verify-tag --generate-notes gtk-themes.7z
          fi
