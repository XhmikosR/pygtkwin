name: Build GTK themes

on:
  push:
    branches:
      - 'main'
      - 'dev*'
      - '!dependabot/**' # avoid duplicate runs; the pull_request event handles dependabot PRs
    tags:
      - 'v*'
    paths: &paths
      - '.github/workflows/build-gtk-themes.yaml'
      - 'create-release.sh'
      - 'install-theme-tools.sh'
      - 'make_gtk_theme.sh'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build themes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # No npm cache in a workflow that publishes releases
          package-manager-cache: false

      - name: Install dependencies
        run: ./install-theme-tools.sh

      - name: Install svgo
        # Ignore scripts to avoid potential security issues.
        run: npm ci --ignore-scripts

      - name: Build GTK themes
        # The script resets PATH, so pass it setup-node's bin dir
        run: NODE_DIR="$(dirname "$(command -v node)")" ./make_gtk_theme.sh

      - name: Upload themes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: gtk-themes.7z
          # Already compressed; the artifact is named after the file
          archive: false
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write # create the release and upload its files

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download themes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gtk-themes.7z

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: ./create-release.sh "$TAG" gtk-themes.7z
